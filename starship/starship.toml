# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = false

palette = "dracula"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$line_break\
$python\
$character"""

right_format = """
$cmd_duration\
$time\
"""

[username]
show_always = true
format = "[$user]($style)@"
style_user = "bold cyan"

[hostname]
ssh_only = false
style = "bold purple"

[directory]
style = "bold green"

[git_branch]
format = "[$branch]($style)"
style = "bold pink"

[git_status]
style = "bold red"
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"


[cmd_duration]
format = '[\[$duration\]]($style)'
style = "bold yellow"

[character] # The name of the module we are configuring is 'character'
success_symbol = "[%](purple)"
error_symbol = "[%](red)"
vimcmd_symbol = "[N](green)"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"

[time]
disabled = false
format = '[\[$time\]]($style)'
time_format = '%T'
utc_time_offset = '+2'


# Define Dracula color palette
[palettes.dracula]
background = "#282a36"
current_line = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"
